apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: salon-app-hpa
  namespace: salon-app

spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: salon-app

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
