apiVersion: batch/v1
kind: Job
metadata:
  generateName: db-migrate-
  namespace: salon-app
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: dev7878/lumiere-salon-dbtools:292cd237d790cdf05cdd47ea352e7bf8b7e97740
          imagePullPolicy: Always
          command:
            - node_modules/.bin/prisma
            - migrate
            - deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: salon-secrets
                  key: DATABASE_URL
