apiVersion: batch/v1
kind: Job
metadata:
  generateName: db-migrate-
  namespace: salon-app
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never 
      containers:
        - name: db-migrate
          image: dev7878/lumiere-salon-dbtools:de4e0f53d10758bc938d115e0c70c6c95f1aba6a
          imagePullPolicy: Always
          command:
            - node_modules/.bin/prisma
            - migrate
            - deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: salon-secrets
                  key: DATABASE_URL
