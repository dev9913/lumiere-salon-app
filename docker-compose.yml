services:
  postgres:
    image: postgres:16
    container_name: lumiere-postgres
    restart: unless-stopped

    environment:
      # Demo secrets or env 
      POSTGRES_USER: salon_user
      POSTGRES_PASSWORD: salon_pass
      POSTGRES_DB: salon_db

    ports:
      - "5432:5432"

    volumes:
      - lumiere_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_user -d salon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: dev7878/salon-app:1.0.6
    container_name: lumiere-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://salon_user:salon_pass@postgres:5432/salon_db?schema=public
      # Demo secrets
      ADMIN_EMAIL: "admin@gmail.com"
      ADMIN_PASSWORD: "adminpass@"
      SEED_DEMO_DATA: "false"

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lumiere_pgdata:
